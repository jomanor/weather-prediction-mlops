# Tooling only: dependencies are pinned in requirements.txt.
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]
