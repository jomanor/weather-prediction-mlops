[project]
name = "weather-prediction-mlops"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "netcdf4>=1.7.3",
    "xarray>=2025.10.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

