name: ML pipeline

# The Spark loop that keeps Atlas fed. Locally it runs from
# spark/spark-scheduler/scheduler.py inside docker compose, but the deployed
# Render instance cannot host it — the worker alone asks for 2 GB against the
# free plan's 512 MB. GitHub's runners give us Python 3.11 and Java 17 for
# free, so the same three jobs run here on the scheduler's cadence.
#
# Requires a repository secret named MONGO_URI holding the Atlas connection
# string (Settings -> Secrets and variables -> Actions).
#
# Note: `schedule` only fires from the repository's default branch. Until this
# file lands on main, runs have to be started by hand with workflow_dispatch.

on:
  schedule:
    - cron: "5 * * * *" # hourly   - score the latest features
    - cron: "20 */6 * * *" # 6-hourly - rebuild the feature table
    - cron: "35 2 * * *" # nightly  - retrain and publish new models
  workflow_dispatch:
    inputs:
      job:
        description: Stage to run
        type: choice
        default: all
        options:
          - all
          - features
          - train
          - inference

concurrency:
  group: ml-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Decide stages
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.pick.outputs.features }}
      train: ${{ steps.pick.outputs.train }}
      inference: ${{ steps.pick.outputs.inference }}
    steps:
      - id: pick
        name: Map trigger to stages
        env:
          SCHEDULE: ${{ github.event.schedule }}
          JOB: ${{ inputs.job }}
        run: |
          set -euo pipefail
          features=0; train=0; inference=0
          case "${SCHEDULE:-}" in
            "5 * * * *")    inference=1 ;;
            "20 */6 * * *") features=1 ;;
            "35 2 * * *")   train=1 ;;
            *)
              # Manual run (schedule is empty) or an unrecognised trigger.
              case "${JOB:-all}" in
                features)  features=1 ;;
                train)     train=1 ;;
                inference) inference=1 ;;
                *)         features=1; train=1; inference=1 ;;
              esac
              ;;
          esac
          {
            echo "features=$features"
            echo "train=$train"
            echo "inference=$inference"
          } >> "$GITHUB_OUTPUT"

  pipeline:
    name: Run Spark jobs
    needs: resolve
    if: needs.resolve.outputs.features == '1' || needs.resolve.outputs.train == '1' || needs.resolve.outputs.inference == '1'
    runs-on: ubuntu-latest
    # Training fits three algorithms under cross-validation; 30 min was not
    # enough and the nightly job was cancelled at the limit, then again at 60.
    # The trainers now cache the split frames and fit candidates in parallel,
    # and the grids are smaller. M2 trains 5 horizons x 2 targets and the
    # feature step alone is ~60 min, so the old 90-min cap cut training
    # mid-horizon (h=1..3 only) and skipped inference.
    # Manual job=all needs ~145 min (62 features + ~80 train + inference) -> 300.
    # Scheduled single-stage runs stay tight at 120 (slowest is ~80 min nightly train).
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 300 || 120 }}
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      # No MLFLOW_TRACKING_URI here on purpose. This job used to export
      # file://$GITHUB_WORKSPACE/mlruns, a throwaway directory destroyed with
      # the runner — it was being read as a model registry. GridFS (artifact) +
      # model_registry (metadata) are canonical; MLflow logging is opt-in and
      # stays off in CI. See docs/model-lifecycle.md.
      # The jobs import spark_config, which lives at /opt/config inside the
      # image. Outside it, put spark/config on the path.
      PYTHONPATH: ${{ github.workspace }}/spark/config
      # Both jobs default their scratch dir to /opt/spark-tmp, which the runner
      # user cannot create.
      # `runner` is not a valid context in a job-level env block; the
      # workspace is writable and thrown away with the runner.
      SPARK_TMP_DIR: ${{ github.workspace }}/.spark-tmp
      # Cached training frames need more than the 1 GB JVM default; the runner
      # has 16 GB.
      SPARK_DRIVER_MEMORY: 6g
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Check for the MONGO_URI secret
        run: |
          if [ -z "${MONGO_URI}" ]; then
            echo "::error title=Missing secret::Set MONGO_URI (the Atlas connection string) under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            spark/requirements.txt
            spark/spark-scheduler/requirements.txt
            scripts/requirements.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r spark/requirements.txt -r spark/spark-scheduler/requirements.txt
          # pyspark is not in requirements.txt because the docker image already
          # ships Spark, so it is pinned here. mlflow is deliberately NOT
          # installed: it is an optional, opt-in side channel in ml_training.py
          # and nothing in this job needs it.
          pip install pyspark==3.5.5
          # scripts/ingest_weather.py (the step below) and the other workflow
          # scripts are HTTP/Mongo clients, not Spark dependencies: their
          # runtime deps live in scripts/requirements.txt, the same file
          # ingest.yml and backfill.yml install.
          pip install -r scripts/requirements.txt

      - name: Ingest current observations
        # Runs once, before the feature rebuild and before inference.
        # raw_weather used to depend on the throttled hourly cron alone, so
        # observations landed ~6-7 h apart and inference scored whatever the
        # last feature rebuild had seen. A non-zero exit is deliberately fatal:
        # if ingest cannot write a fresh observation, the rest of the run would
        # score stale data (see docs/handoff.md hard rule 1). ~15 s.
        if: needs.resolve.outputs.inference == '1' || needs.resolve.outputs.features == '1'
        run: python scripts/ingest_weather.py

      - name: Backfill recent hourly history
        # GitHub throttles the hourly crons to a handful of runs/day, so live
        # ingest alone leaves 6-7 h gaps. Filling the last two days hourly keeps
        # the short-range charts (and rolling features) dense without new
        # infrastructure. Idempotent: rows are skipped by _id, so steady state
        # is one row per city-hour, not per run. ~1-2 min.
        # Best-effort by design: this top-up is a density improvement, not a
        # correctness gate, so a lagging archive/forecast API warns
        # (--best-effort) and never blocks the feature rebuild or inference
        # below; continue-on-error also absorbs a genuine write failure, which
        # the step still reports in its log. The strict default (exit 1) is
        # what backfill.yml's repair run uses.
        if: needs.resolve.outputs.features == '1'
        continue-on-error: true
        run: python scripts/backfill_historical_data.py --days 2 --recent 2 --best-effort

      - name: Feature engineering
        if: needs.resolve.outputs.features == '1'
        run: python spark/spark-jobs/batch_processing.py

      - name: Pipeline summary (features)
        if: ${{ always() && needs.resolve.outputs.features == '1' }}
        run: python scripts/pipeline_summary.py >> "$GITHUB_STEP_SUMMARY" || true

      - name: Train models
        if: needs.resolve.outputs.train == '1'
        run: python spark/spark-jobs/ml_training.py

      - name: Prune old model artifacts
        # Always prune once the train stage was selected: a failed/partial
        # training run still leaves artifacts (and matching registry rows) that
        # the next run would otherwise accumulate. Stage gating is unchanged.
        if: ${{ always() && needs.resolve.outputs.train == '1' }}
        run: python scripts/prune_models.py

      - name: Pipeline summary (train)
        if: ${{ always() && needs.resolve.outputs.train == '1' }}
        run: python scripts/pipeline_summary.py >> "$GITHUB_STEP_SUMMARY" || true

      - name: Score latest features
        if: needs.resolve.outputs.inference == '1'
        run: python spark/spark-jobs/inference.py

      - name: Pipeline summary (inference)
        # Surfaces prediction coverage (rows/cities per horizon, oldest source
        # timestamp) and the non-blocking ::warning the hourly run emits. A
        # shrunken prediction set used to be invisible: 14 of 15 cities were
        # dropped by the assembler on 2026-10-30 and only a stale row was
        # written.
        if: ${{ always() && needs.resolve.outputs.inference == '1' }}
        run: python scripts/pipeline_summary.py >> "$GITHUB_STEP_SUMMARY" || true
