name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Python lint — ruff + black
  # ─────────────────────────────────────────────────────────────────────────
  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff black
      - name: ruff check
        run: ruff check backend scripts spark kafka
      - name: black check
        run: black --check backend scripts spark kafka

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Backend tests — FastAPI service (offline, dependency-overridden fakes)
  # ─────────────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: python-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: pytest
        run: pytest backend/tests -q

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Pipeline tests — Kafka, Spark jobs, scripts
  # ─────────────────────────────────────────────────────────────────────────
  pipeline-test:
    name: Pipeline tests
    runs-on: ubuntu-latest
    needs: python-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # PySpark 3.5 supports Python ≤3.11; its pandas shim still imports
          # distutils, which was dropped from the stdlib in 3.12.
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: |
          pip install \
            pytest pytest-cov \
            pyspark==3.5.5 \
            kafka-python \
            pymongo \
            requests \
            python-dotenv \
            mlflow==2.19.0 \
            httpx \
            mongomock
      - name: Run pipeline unit tests
        run: |
          pytest tests/unit/ \
            --cov=kafka/kafka-consumer \
            --cov=kafka/kafka-producer \
            --cov=spark/spark-jobs \
            --cov=scripts \
            --cov-report=term-missing \
            -q

  # ─────────────────────────────────────────────────────────────────────────
  # 4. Frontend — typecheck, lint, tests, production build
  # ─────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # ─────────────────────────────────────────────────────────────────────────
  # 5. Integration tests (PRs and branch/main pushes). The mongo:6 service
  #    backs the real index guardrails in
  #    tests/integration/test_mongo_index_sort.py; the remaining integration
  #    tests run offline against mongomock. ``pymongo`` is installed below for
  #    both.
  # ─────────────────────────────────────────────────────────────────────────
  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: pipeline-test
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: |
          pip install \
            pytest \
            pytest-asyncio \
            pyspark==3.5.5 \
            kafka-python \
            pymongo \
            requests \
            python-dotenv \
            mongomock
      - name: Run integration tests
        run: pytest tests/integration/ -q
        env:
          PYTHONPATH: ${{ github.workspace }}
          MONGO_URI: mongodb://localhost:27017

  # ─────────────────────────────────────────────────────────────────────────
  # 6. Docker build validation
  # ─────────────────────────────────────────────────────────────────────────
  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [backend-test, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: producer
            context: kafka/kafka-producer
          - service: consumer
            context: kafka/kafka-consumer
          - service: backend
            context: backend
          - service: spark
            context: spark
          - service: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service }} image
        run: docker build --tag weather-${{ matrix.service }}:ci ${{ matrix.context }}
