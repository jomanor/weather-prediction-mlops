name: Ingest

# The deployed stack runs no Kafka, so nothing writes fresh observations and
# every now-relative view (history, stats, benchmark) has nothing to show.
# This fills raw_weather on the cadence the producer used to.
on:
  schedule:
    # Runs before the ML workflow's hourly inference (":05"), so each
    # prediction pass reads observations that have already landed.
    - cron: "50 * * * *"
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Check the secret is configured
        run: |
          if [ -z "$MONGO_URI" ]; then
            echo "::error title=Missing secret::Add a repository secret named MONGO_URI."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pymongo

      - name: Ingest current observations
        run: python scripts/ingest_weather.py
