[build]
  base = "frontend"
  publish = "dist"
  command = "npm ci && npm run build"

[build.environment]
  NODE_VERSION = "22"

# Hashed build assets are content-addressed and safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# Edge proxy: the SPA talks to the same origin, the edge forwards to FastAPI.
# This URL matches the service name in render.yaml; if Render assigns a
# different subdomain, update it here (one line) and push.
[[redirects]]
  from = "/api/*"
  to = "https://weather-prediction-mlops.onrender.com/api/:splat"
  status = 200
  force = true

# Client-side routing fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
