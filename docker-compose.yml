services:
  
  # MongoDB
  mongodb:
    image: mongo:6.0
    container_name: weather-mongodb
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo-data:/data/db
    networks:
      - weather-network

  # FastAPI backend
  weather-api:
    build: ./backend
    container_name: weather-api
    ports:
      - 8000:8000
    environment:
      MONGO_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/weather_db?authSource=admin
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      AEMET_API_KEY: ${AEMET_API_KEY}
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - weather-network

  # Spark Master
  spark-master:
    image: apache/spark:3.5.5-python3
    container_name: spark-master
    command: >
      bash -c "/opt/spark/sbin/start-master.sh && tail -f /dev/null"
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_MASTER_OPTS=-Dspark.rpc.message.maxSize=256
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - spark-logs:/opt/spark/spark-events
    networks:
      - weather-network
  
  # Spark Worker
  spark-worker:
    image: apache/spark:3.5.5-python3
    container_name: spark-worker
    command: >
      bash -c "/opt/spark/sbin/start-worker.sh spark://spark-master:7077 && tail -f /dev/null"
    environment:
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_OPTS=-Dspark.rpc.message.maxSize=256
    ports:
      - "8081:8081"
    depends_on:
      - spark-master
    volumes:
      - spark-logs:/opt/spark/spark-events
      - spark-tmp:/opt/spark-tmp
    networks:
      - weather-network

  # Spark History
  spark-history:
    image: apache/spark:3.5.5-python3
    container_name: spark-history
    command: >
      bash -c "/opt/spark/sbin/start-history-server.sh && tail -f /dev/null"
    environment:
      - SPARK_HISTORY_OPTS=-Dspark.history.fs.logDirectory=/opt/spark/spark-events
      - SPARK_NO_DAEMONIZE=true
    ports:
      - "18080:18080"
    volumes:
      - spark-logs:/opt/spark/spark-events
    networks:
      - weather-network

  # MLflow Tracking Server
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    container_name: weather-mlflow
    command: >
      mlflow server
        --backend-store-uri /mlflow/experiments
        --default-artifact-root /mlflow/artifacts
        --host 0.0.0.0
        --port 5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    networks:
      - weather-network
    restart: unless-stopped

  # Spark Scheduler
  spark-scheduler:
    build: ./spark
    container_name: spark-scheduler
    environment:
      MONGO_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/weather_db?authSource=admin
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      - spark-master
      - spark-worker
      - mongodb
      - mlflow
    ports:
      - "4040:4040"
    volumes:
      - spark-tmp:/opt/spark-tmp
      - spark-logs:/opt/spark/spark-events
      # Local stack only: the single thresholds authority (backend/app/core/
      # thresholds.py) is imported, never copied. The image has no backend/ tree,
      # so inference.py resolves it at /backend. Batch E removes the Spark
      # services entirely.
      - ./backend/app:/backend/app:ro
    networks:
      - weather-network
    restart: unless-stopped

  # React frontend (built static assets served by nginx, proxies /api)
  weather-frontend:
    build: ./frontend
    container_name: weather-frontend
    ports:
      - "8080:80"
    depends_on:
      - weather-api
    networks:
      - weather-network
    restart: unless-stopped

volumes:
  mongo-data:
  spark-logs:
  spark-tmp:
  mlflow-data:

networks:
  weather-network:
    driver: bridge